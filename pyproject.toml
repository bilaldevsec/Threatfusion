[project]
name = "threatfusion"
version = "0.1.0"
description = "ThreatFusion: AI-driven SOC alert triage FYP platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend/src"
strict = true
ignore_missing_imports = true
