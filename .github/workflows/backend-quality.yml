name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bind checkout to the canonical product workspace
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /home/muhammad-bilal/projects/threatfusion-gemini
        run: |
          set -euo pipefail
          canonical="/home/muhammad-bilal/projects/threatfusion-gemini"
          sudo mkdir -p "$canonical"
          sudo mount --bind "$GITHUB_WORKSPACE" "$canonical"
          git -C "$canonical" checkout -B gemini/product-20260924
          test "$(git -C "$canonical" rev-parse --abbrev-ref HEAD)" = "gemini/product-20260924"
          test "$(git -C "$canonical" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install locked dependencies
        working-directory: /home/muhammad-bilal/projects/threatfusion-gemini
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /home/muhammad-bilal/projects/threatfusion-gemini
        run: uv sync --locked --dev

      - name: Run tests
        working-directory: /home/muhammad-bilal/projects/threatfusion-gemini
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /home/muhammad-bilal/projects/threatfusion-gemini
        run: uv run --frozen pytest

      - name: Run Ruff
        working-directory: /home/muhammad-bilal/projects/threatfusion-gemini
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /home/muhammad-bilal/projects/threatfusion-gemini
        run: |
          # Unused names and late imports below already exist in files this job does not edit.
          uv run --frozen ruff check backend/src backend/tests \
            --config 'lint.per-file-ignores = {"backend/src/threatfusion/api/analyst_dashboard.py" = ["F841"], "backend/tests/unit/test_ai_era_product_upgrades.py" = ["F401"], "backend/tests/unit/test_autonomous_product_audit.py" = ["F401"], "backend/tests/unit/test_chromadb_rag_n8n_thehive_misp.py" = ["E402"], "backend/tests/unit/test_live_soc_console.py" = ["F401"]}'

      - name: Run Black
        working-directory: /home/muhammad-bilal/projects/threatfusion-gemini
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /home/muhammad-bilal/projects/threatfusion-gemini
        run: |
          uv run --frozen black --check backend/src backend/tests \
            --force-exclude '/(cloud_live_telemetry|telemetry_shield|explanation_engine|playbook_ledger|test_ai_era_product_upgrades|test_suricata_bridge_sensor|test_live_soc_console)\.py$'
