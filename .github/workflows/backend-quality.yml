name: Backend quality

on:
  push:
    branches: [main, gemini/product-20260924]
  pull_request:
    branches: [main, gemini/product-20260924]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system NSS tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnss3-tools

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run boundary preflight (B0-B6)
        run: env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 uv run --frozen python scripts/boundary_preflight.py --venv .venv --json

      - name: Run repository truth audit (7/7)
        run: env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 uv run --frozen python scripts/audit_repo_truth.py --json

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Check frontend JavaScript syntax
        run: node --check frontend/js/soc_dashboard.js

      - name: Run tests
        run: env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 GEMINI_ENABLED=false uv run --frozen pytest

      - name: Run Ruff
        run: uv run --frozen ruff check backend src scripts

      - name: Run Black
        run: uv run --frozen black --check backend src scripts
