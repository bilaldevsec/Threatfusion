name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run boundary preflight (B0-B6)
        run: env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 uv run --frozen python scripts/boundary_preflight.py --venv .venv --json

      - name: Run repository truth audit (7/7)
        run: env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 uv run --frozen python scripts/audit_repo_truth.py --json

      - name: Run tests
        run: env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 GEMINI_ENABLED=false uv run --frozen pytest

      - name: Run Ruff
        run: uv run --frozen ruff check backend/src backend/tests

      - name: Run Black
        run: uv run --frozen black --check backend/src backend/tests
