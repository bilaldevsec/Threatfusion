name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --frozen pytest

      - name: Run Ruff
        run: uv run --frozen ruff check backend/src backend/tests

      - name: Run Black
        run: uv run --frozen black --check backend/src backend/tests
